# Build the container image and publish it to the GitHub Container Registry (ghcr.io).
#
#   push to main       -> ghcr.io/<owner>/ceph-calc:latest
#   git tag vX.Y.Z     -> ghcr.io/<owner>/ceph-calc:X.Y.Z
#   pull request       -> build only (tests run inside the build), nothing is pushed
#
# Images are multi-arch (linux/amd64 + linux/arm64). The Containerfile build stage runs on the
# runner's native platform and the arm64 runtime stage only copies files, so no QEMU emulation
# is needed. The unit tests run as part of the image build.

name: Container image

on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ceph-calc

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Full history with tags for the version label (git describe).
          fetch-depth: 0

      - name: Version label
        id: version
        run: |
          describe=$(git describe --tags --long --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || true)
          echo "describe=$describe" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest: only for pushes to the default branch (main)
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            # X.Y.Z: for git tags vX.Y.Z (the "v" prefix is stripped)
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=ceph-calc
            org.opencontainers.image.description=Interactive capacity calculator for your future ceph cluster
            org.opencontainers.image.licenses=GPL-3.0-only

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          # CEPH_CALC_CHANNEL: release channel shown in the page; switch to stable when ready.
          build-args: |
            CEPH_CALC_GIT_DESCRIBE=${{ steps.version.outputs.describe }}
            CEPH_CALC_CHANNEL=alpha
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
