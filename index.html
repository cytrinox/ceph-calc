<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Interactive capacity calculator for your future ceph cluster" />
    <!-- Link previews. nginx replaces the placeholder origin ceph-calc.invalid with the request's origin (see nginx.conf). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ceph-calc" />
    <meta property="og:title" content="The ceph real net capacity calculator" />
    <meta property="og:description" content="Interactive capacity calculator for your future ceph cluster" />
    <meta property="og:url" content="https://ceph-calc.invalid/" />
    <meta property="og:image" content="https://ceph-calc.invalid/screenshot_dark.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The calculator in dark mode: cluster setup, real net capacity of an EC 6+2 pool, raw data distribution and layout comparison." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>The ceph real net capacity calculator</title>
    <script>
      // Apply the theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('ceph-calculator-theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="color-scheme"]').setAttribute('content', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
