<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" width="760" height="200" font-family="IBM Plex Sans, sans-serif" role="img" aria-label="A 16K read with a 4K and a 16K stripe_unit">
  <rect class="canvas" x="0" y="0" width="760" height="200" rx="12" fill="#0b1120"/>
  <text class="title" x="30" y="26" text-anchor="start" fill="#e8edf6" font-size="14" font-weight="700">stripe_unit 4K</text>
  <text class="muted" x="30" y="44" text-anchor="start" fill="#96a3bb" font-size="11">stripe 0 of an object, EC 4+2</text>
  <text class="muted" x="55" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 0</text>
  <rect class="data" x="30" y="74" width="50" height="30" rx="4" fill="#4cb1d7"/>
  <text class="on-data mono" x="55" y="93" text-anchor="middle" fill="#032421" font-size="11" font-family="IBM Plex Mono, monospace">0–4K</text>
  <text class="muted" x="111" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 1</text>
  <rect class="data" x="86" y="74" width="50" height="30" rx="4" fill="#4cb1d7"/>
  <text class="on-data mono" x="111" y="93" text-anchor="middle" fill="#032421" font-size="11" font-family="IBM Plex Mono, monospace">4–8K</text>
  <text class="muted" x="167" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 2</text>
  <rect class="data" x="142" y="74" width="50" height="30" rx="4" fill="#4cb1d7"/>
  <text class="on-data mono" x="167" y="93" text-anchor="middle" fill="#032421" font-size="11" font-family="IBM Plex Mono, monospace">8–12K</text>
  <text class="muted" x="223" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 3</text>
  <rect class="data" x="198" y="74" width="50" height="30" rx="4" fill="#4cb1d7"/>
  <text class="on-data mono" x="223" y="93" text-anchor="middle" fill="#032421" font-size="11" font-family="IBM Plex Mono, monospace">12–16K</text>
  <text class="muted" x="279" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 4</text>
  <rect class="parity" x="254" y="74" width="50" height="30" rx="4" fill="#1a5478"/>
  <text class="on-parity mono" x="279" y="93" text-anchor="middle" fill="#ffffff" font-size="11" font-family="IBM Plex Mono, monospace">p</text>
  <text class="muted" x="335" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 5</text>
  <rect class="parity" x="310" y="74" width="50" height="30" rx="4" fill="#1a5478"/>
  <text class="on-parity mono" x="335" y="93" text-anchor="middle" fill="#ffffff" font-size="11" font-family="IBM Plex Mono, monospace">q</text>
  <rect class="highlight" x="27" y="71" width="221" height="36" rx="6" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <text class="muted" x="30" y="132" text-anchor="start" fill="#96a3bb" font-size="11">a 16K read at offset 0 (highlighted)</text>
  <text class="warning-text" x="30" y="154" text-anchor="start" fill="#fbbf24" font-size="12" font-weight="600">→ 4 shards → 4 OSD reads</text>
  <text class="title" x="400" y="26" text-anchor="start" fill="#e8edf6" font-size="14" font-weight="700">stripe_unit 16K</text>
  <text class="muted" x="400" y="44" text-anchor="start" fill="#96a3bb" font-size="11">stripe 0 of an object, EC 4+2</text>
  <text class="muted" x="425" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 0</text>
  <rect class="data" x="400" y="74" width="50" height="30" rx="4" fill="#4cb1d7"/>
  <text class="on-data mono" x="425" y="93" text-anchor="middle" fill="#032421" font-size="11" font-family="IBM Plex Mono, monospace">0–16K</text>
  <text class="muted" x="481" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 1</text>
  <rect class="data faint" x="456" y="74" width="50" height="30" rx="4" fill="#4cb1d7" opacity="0.35"/>
  <text class="on-data mono" x="481" y="93" text-anchor="middle" fill="#032421" font-size="11" font-family="IBM Plex Mono, monospace">16–32K</text>
  <text class="muted" x="537" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 2</text>
  <rect class="data faint" x="512" y="74" width="50" height="30" rx="4" fill="#4cb1d7" opacity="0.35"/>
  <text class="on-data mono" x="537" y="93" text-anchor="middle" fill="#032421" font-size="11" font-family="IBM Plex Mono, monospace">32–48K</text>
  <text class="muted" x="593" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 3</text>
  <rect class="data faint" x="568" y="74" width="50" height="30" rx="4" fill="#4cb1d7" opacity="0.35"/>
  <text class="on-data mono" x="593" y="93" text-anchor="middle" fill="#032421" font-size="11" font-family="IBM Plex Mono, monospace">48–64K</text>
  <text class="muted" x="649" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 4</text>
  <rect class="parity" x="624" y="74" width="50" height="30" rx="4" fill="#1a5478"/>
  <text class="on-parity mono" x="649" y="93" text-anchor="middle" fill="#ffffff" font-size="11" font-family="IBM Plex Mono, monospace">p</text>
  <text class="muted" x="705" y="66" text-anchor="middle" fill="#96a3bb" font-size="11">shard 5</text>
  <rect class="parity" x="680" y="74" width="50" height="30" rx="4" fill="#1a5478"/>
  <text class="on-parity mono" x="705" y="93" text-anchor="middle" fill="#ffffff" font-size="11" font-family="IBM Plex Mono, monospace">q</text>
  <rect class="highlight" x="397" y="71" width="53" height="36" rx="6" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <text class="muted" x="400" y="132" text-anchor="start" fill="#96a3bb" font-size="11">a 16K read at offset 0 (highlighted)</text>
  <text class="warning-text" x="400" y="154" text-anchor="start" fill="#fbbf24" font-size="12" font-weight="600">→ 1 shard → 1 OSD read</text>
  <line class="line" x1="380" y1="16" x2="380" y2="160" fill="none" stroke="#6a7790"/>
  <text class="muted" x="380" y="186" text-anchor="middle" fill="#96a3bb" font-size="11">With EC optimizations a read touches only the data shards holding its range (classic EC reads all k)</text>
</svg>
