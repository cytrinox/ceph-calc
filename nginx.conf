# Origin for the Open Graph tags in index.html (og:url, og:image): the request's own scheme and host.
# Behind a TLS-terminating proxy the scheme comes from X-Forwarded-Proto; the proxy must pass the original Host.
# The host is checked against a strict pattern so a crafted Host header cannot inject markup.
map $http_x_forwarded_proto $og_scheme {
    ~^(?<fwd_proto>https?)(\s*,|$)  $fwd_proto;
    default                          $scheme;
}

map $http_host $og_host {
    ~^(?<safe_host>[A-Za-z0-9.-]+(:[0-9]+)?)$  $safe_host;
    default                                     localhost;
}

server {
    listen       8080;
    listen  [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    server_tokens off;

    # Redirects (e.g. /help/<name> → /help/<name>/) keep the path only: behind a proxy or a port mapping the
    # container's own host and port (8080) would be wrong.
    absolute_redirect off;

    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build output: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Single-page app: always revalidate index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        add_header X-Frame-Options "DENY";
        sub_filter      'https://ceph-calc.invalid' '$og_scheme://$og_host';
        sub_filter_once off;
        # No client-side routes (the state lives in the #hash): unknown paths are real 404s.
        try_files $uri $uri/ =404;
    }

    # nginx's mime.types has no entry for web app manifests.
    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }
}
